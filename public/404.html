<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const base = '/camerossakaprincipal/';
      const redirect = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      if (window.location.pathname.startsWith(base)) {
        window.location.replace(`${base}?redirect=${encodeURIComponent(redirect)}`);
      }
    </script>
  </head>
  <body></body>
</html>
