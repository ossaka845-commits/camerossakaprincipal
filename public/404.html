<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const projectBase = '/camerossakaprincipal/';
      const base = window.location.pathname.startsWith(projectBase) ? projectBase : '/';
      const redirect = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      window.location.replace(`${base}?redirect=${encodeURIComponent(redirect)}`);
    </script>
  </head>
  <body></body>
</html>
